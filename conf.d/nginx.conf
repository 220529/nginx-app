# ERP settlement gateway (HTTPS)
#
# This is the production configuration installed at:
#   /etc/nginx/conf.d/erp-settlement.conf
#
# The certificate files are created on the server by Certbot and are never
# stored in Git. The host gateway forwards application traffic to the
# frontend container on the loopback interface.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name erp.lytt.fun;

    ssl_certificate /etc/letsencrypt/live/erp.lytt.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/erp.lytt.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name erp.lytt.fun;
    return 301 https://$host$request_uri;
}
