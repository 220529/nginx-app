name: Deploy shared Nginx gateway

# GitHub event filters cannot read config/gateway.env; keep this prefix in sync
# with GATEWAY_TAG_PREFIX when changing the gateway release namespace.
on:
  push:
    tags:
      - "master/nginx-app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-gateway-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load gateway configuration
        id: config
        shell: bash
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC1091
          . scripts/lib/gateway-common.sh
          set -a
          # shellcheck disable=SC1091
          . config/gateway.env
          set +a
          validate_gateway_settings

          {
            printf 'tag_prefix=%s\n' "$GATEWAY_TAG_PREFIX"
            printf 'staging_dir=%s\n' "$GATEWAY_STAGING_DIR"
            printf 'config_dir=%s\n' "$GATEWAY_CONFIG_DIR"
            printf 'manifest_path=%s\n' "$GATEWAY_MANIFEST_PATH"
            printf 'backup_dir=%s\n' "$GATEWAY_BACKUP_DIR"
            printf 'webroot_path=%s\n' "$GATEWAY_WEBROOT_PATH"
            printf 'timer_name=%s\n' "$GATEWAY_CERTBOT_TIMER_NAME"
            printf 'renew_on_calendar=%s\n' "$GATEWAY_RENEW_ON_CALENDAR"
            printf 'renew_random_delay=%s\n' "$GATEWAY_RENEW_RANDOM_DELAY"
          } >> "$GITHUB_OUTPUT"

      - name: Render gateway site configurations
        shell: bash
        run: |
          bash scripts/render-config.sh .generated/gateway
          cp scripts/deploy-host-nginx.sh .generated/gateway/deploy-gateway.sh
          mkdir -p .generated/gateway/lib
          cp scripts/lib/gateway-common.sh .generated/gateway/lib/gateway-common.sh

      - name: Validate rendered Nginx configurations
        run: |
          set -Eeuo pipefail
          # shellcheck disable=SC1091
          . scripts/lib/gateway-common.sh
          shopt -s nullglob
          site_env_files=(.generated/gateway/sites/*.env)
          if [ "${#site_env_files[@]}" -eq 0 ]; then
            echo "No rendered gateway site definitions found." >&2
            exit 1
          fi

          cert_root="$(mktemp -d)"
          trap 'rm -rf "$cert_root"' EXIT
          nginx_args=(run --rm
            --volume "$PWD/.generated/gateway/sites:/etc/nginx/conf.d:ro")
          cert_index=0

          for site_env in "${site_env_files[@]}"; do
            load_site_config "$site_env"

            if [ "$SITE_TLS_ENABLED" = "true" ]; then
              host_cert_dir="$cert_root/$cert_index"
              mkdir -p "$host_cert_dir"
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout "$host_cert_dir/privkey.pem" \
                -out "$host_cert_dir/fullchain.pem" \
                -subj "/CN=$SITE_DOMAIN" \
                >/dev/null 2>&1
              nginx_args+=(--volume "$host_cert_dir:$SITE_CERT_DIR:ro")
              cert_index=$((cert_index + 1))
            fi
          done

          docker "${nginx_args[@]}" nginx:1.27-alpine nginx -t
          docker run --rm \
            --volume "$PWD/.generated/gateway/bootstrap:/etc/nginx/conf.d:ro" \
            nginx:1.27-alpine nginx -t

      - name: Upload gateway release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: ".generated/gateway"
          target: ${{ steps.config.outputs.staging_dir }}/
          strip_components: 2
          overwrite: true
          rm: true

      - name: Deploy gateway on server
        uses: appleboy/ssh-action@v1.0.3
        env:
          GATEWAY_TAG_PREFIX: ${{ steps.config.outputs.tag_prefix }}
          GATEWAY_STAGING_DIR: ${{ steps.config.outputs.staging_dir }}
          GATEWAY_CONFIG_DIR: ${{ steps.config.outputs.config_dir }}
          GATEWAY_MANIFEST_PATH: ${{ steps.config.outputs.manifest_path }}
          GATEWAY_BACKUP_DIR: ${{ steps.config.outputs.backup_dir }}
          GATEWAY_WEBROOT_PATH: ${{ steps.config.outputs.webroot_path }}
          GATEWAY_CERTBOT_TIMER_NAME: ${{ steps.config.outputs.timer_name }}
          GATEWAY_RENEW_ON_CALENDAR: ${{ steps.config.outputs.renew_on_calendar }}
          GATEWAY_RENEW_RANDOM_DELAY: ${{ steps.config.outputs.renew_random_delay }}
          GATEWAY_DEPLOY_SCRIPT_PATH: ${{ steps.config.outputs.staging_dir }}/deploy-gateway.sh
          GATEWAY_COMMON_FILE: ${{ steps.config.outputs.staging_dir }}/lib/gateway-common.sh
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          envs: GATEWAY_TAG_PREFIX,GATEWAY_STAGING_DIR,GATEWAY_CONFIG_DIR,GATEWAY_MANIFEST_PATH,GATEWAY_BACKUP_DIR,GATEWAY_WEBROOT_PATH,GATEWAY_CERTBOT_TIMER_NAME,GATEWAY_RENEW_ON_CALENDAR,GATEWAY_RENEW_RANDOM_DELAY,GATEWAY_DEPLOY_SCRIPT_PATH,GATEWAY_COMMON_FILE,CERTBOT_EMAIL
          command_timeout: 20m
          script: |
            set -Eeuo pipefail
            : "${GATEWAY_DEPLOY_SCRIPT_PATH:?GATEWAY_DEPLOY_SCRIPT_PATH is required}"
            bash "$GATEWAY_DEPLOY_SCRIPT_PATH"
